<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="日本酒ログ">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<title>日本酒ログ</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/app.css?v=4">
</head>
<body>
<div id="bg"><canvas id="petals"></canvas></div>

<header id="hdr">
  <img class="logo" src="icons/icon-180.png" alt="">
  <b>日本酒ログ</b>
  <button id="btn-set" class="ghost" type="button">設定</button>
</header>

<main id="main">
  <section id="v-reg">
    <div class="sec">写真（瓶とラベル）</div>
    <div class="slots">
      <div class="slot" data-slot="bottle">
        <div class="box"><span>瓶</span><img alt=""></div>
        <label class="btn">撮影<input type="file" accept="image/*" capture="environment"></label>
        <label class="btn">写真から<input type="file" accept="image/*"></label>
      </div>
      <div class="slot" data-slot="label">
        <div class="box"><span>ラベル</span><img alt=""></div>
        <label class="btn">撮影<input type="file" accept="image/*" capture="environment"></label>
        <label class="btn">写真から<input type="file" accept="image/*"></label>
      </div>
    </div>
    <button id="btn-read" class="main" type="button">読み取る</button>
    <button id="btn-manual" class="link" type="button" style="margin-top:8px">読み取らず手入力する</button>
    <div id="reg-err" class="err" hidden></div>
    <div class="card cost">
      <small>今月のAPI料金</small>
      <span id="cost-total" class="big">—</span>
    </div>
    <div class="sec">メモ</div>
    <textarea class="memo" placeholder="飲んだ場所、合わせた料理など"></textarea>
    <div class="credit">さけのわデータを利用しています（<a href="https://sakenowa.com/" target="_blank" rel="noopener">sakenowa.com</a>）</div>
  </section>

  <section id="v-res" hidden>
    <div class="card head">
      <div class="thumb big"><span>瓶</span><img alt=""></div>
      <div class="hinfo">
        <div id="r-name" class="name">—</div>
        <div id="r-sub" class="sub"></div>
        <div id="r-match" class="note"></div>
        <div id="r-photos" class="note"></div>
        <button id="btn-pick" class="link" type="button">別の銘柄にする</button>
      </div>
    </div>
    <details class="card" id="r-basic">
      <summary>基本情報を直す</summary>
      <div class="form" id="basic-form"></div>
    </details>

    <div class="sec">さけのわ 6軸（みんなの評価）</div>
    <div class="card" id="r-radar"></div>

    <div class="sec">唎酒師の項目（10段階）　線 ＝ 一般的な位置</div>
    <div class="card" id="r-params"></div>
    <button id="btn-reest" class="sub-btn" type="button">AIの推定をやり直す</button>

    <div class="sec">外観・タイプ・評価</div>
    <div class="card form" id="r-looks"></div>

    <div class="sec">香り（ボタンで選ぶ）</div>
    <div class="card">
      <div id="a-sum" class="asum"></div>
      <div id="a-cats" class="cats"></div>
      <div id="a-chips" class="chips" hidden></div>
    </div>

    <div class="sec">メモ</div>
    <textarea class="memo" placeholder="メモ"></textarea>
    <button id="btn-save" class="main" type="button">保存</button>
    <div id="save-msg" class="note center"></div>
    <div class="credit">さけのわデータを利用しています（<a href="https://sakenowa.com/" target="_blank" rel="noopener">sakenowa.com</a>）</div>
  </section>

  <section id="v-list" hidden>
    <input id="q" type="search" placeholder="銘柄・蔵元で絞り込み">
    <div class="list-toolbar"><button id="l-refresh" class="ghost" type="button">同期する</button></div>
    <div id="l-sync" class="note" role="status" aria-live="polite"></div>
    <div id="l-count" class="sec"></div>
    <div id="l-items"></div>
    <div class="credit">さけのわデータを利用しています（<a href="https://sakenowa.com/" target="_blank" rel="noopener">sakenowa.com</a>）</div>
  </section>
</main>

<nav id="tabs">
  <button data-v="reg" type="button">登録</button>
  <button data-v="res" type="button">結果</button>
  <button data-v="list" type="button">一覧</button>
</nav>

<div id="modal" hidden>
  <div class="modal-body">
    <div id="modal-title" class="mtitle"></div>
    <div id="modal-content"></div>
    <button id="modal-close" class="sub-btn" type="button">閉じる</button>
  </div>
</div>
<div id="busy" hidden><div class="spin"></div><div id="busy-msg">読み取り中…</div></div>

<script src="vendor/fuse.min.js"></script>
<script src="vendor/browser-image-compression.js"></script>
<script src="js/config.js?v=1"></script>
<script src="js/aroma.js?v=1"></script>
<script src="js/data.js?v=1"></script>
<script src="js/api.js?v=3"></script>
<script src="js/bg.js?v=2"></script>
<script src="js/viewport.js?v=1"></script>
<script src="js/record-cache.js?v=1"></script>
<script src="js/app.js?v=4"></script>
</body>
</html>
